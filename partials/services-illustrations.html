    middle column (overflow:hidden/clip on the column), the Figma illustration frame itself does NOT clip.

  - Group wrappers (data-layer="plat-map|parcel|parcel-foundation|survey-stakes|house|tree|building|dimension")

    z-indexes, so keep the order.
  - Leaf layers: class = kebab Figma layer name, data-part = same, data-node-id = Figma id.
    Wrapper insets (e.g. inset:-0.42% -0.24%) reproduce Figma's stroke-bleed boxes - keep them.
  - No rotations/transforms exist in these illustrations (all isometry is baked into the SVGs).
  - Asset paths are relative to the repo root (assets/services/...).
-->
